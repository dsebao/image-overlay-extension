<!DOCTYPE html>
<html>
<head>
  <title>Image Overlay Extension</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      padding: 16px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #111116;
      color: #d4d4de;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #222230;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #4f5ff0, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #eeeef5;
      letter-spacing: 0.01em;
    }

    .header p {
      font-size: 11px;
      color: #606078;
      margin-top: 1px;
    }

    /* ── Container ── */
    .container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Cards / Sections ── */
    .card {
      background-color: #18181f;
      border: 1px solid #24242f;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Upload area ── */
    .upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1.5px dashed #2e2e40;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      position: relative;
    }

    .upload-area:hover {
      border-color: #4f5ff0;
      background-color: #1c1c2a;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 22px;
      line-height: 1;
    }

    .upload-label {
      font-size: 12px;
      color: #8888a8;
      text-align: center;
    }

    .upload-label strong {
      color: #6672f5;
      font-weight: 600;
    }

    #imagePreview {
      max-width: 100%;
      max-height: 130px;
      border-radius: 7px;
      border: 1px solid #2e2e40;
      display: none;
      object-fit: contain;
    }

    /* ── Slider rows ── */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-label {
      font-size: 12px;
      font-weight: 500;
      color: #9494b0;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .slider-value-wrap {
      display: flex;
      align-items: center;
      background: #1e1e2e;
      border-radius: 20px;
      border: 1px solid #2e2e44;
      padding: 2px 10px 2px 8px;
      gap: 1px;
      transition: border-color 0.15s;
    }

    .slider-value-wrap:focus-within {
      border-color: #5a6af0;
    }
    
    .reset-btn {
      background: #1e1e2e;
      border: 1px solid #2e2e44;
      padding: 4px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      width: 24px;
      height: 24px;
    }
    
    .reset-btn svg {
      width: 14px;
      height: 14px;
      stroke: #6672f5;
      transition: transform 0.2s;
    }
    
    .reset-btn:hover {
      background: #24243a;
      border-color: #4a4a6a;
    }
    
    .reset-btn:hover svg {
      transform: rotate(-45deg);
    }
    
    .reset-btn:active {
      transform: scale(0.95);
    }

    .slider-value-input {
      font-size: 12px;
      font-weight: 600;
      color: #6672f5;
      background: transparent;
      border: none;
      outline: none;
      width: 46px;
      text-align: right;
      -moz-appearance: textfield;
    }

    .slider-value-input::-webkit-outer-spin-button,
    .slider-value-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    .slider-unit {
      font-size: 12px;
      font-weight: 600;
      color: #4a4a6a;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a2a3a;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #5a6af0;
      border: 2px solid #111116;
      box-shadow: 0 0 0 1px #5a6af0;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 0 3px rgba(90, 106, 240, 0.25);
    }

    /* ── Toggle ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }

    .toggle-text {
      font-size: 13px;
      color: #c0c0d4;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2a2a3a;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid #35354a;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #55556a;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .toggle-track {
      background: #3d48c8;
      border-color: #4f5ff0;
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #ffffff;
    }

    /* ── Buttons ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s, background-color 0.15s;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    #applyOverlay {
      background: linear-gradient(135deg, #4f5ff0, #6b4ef7);
      color: #ffffff;
    }

    #applyOverlay:hover:not(:disabled) {
      opacity: 0.88;
    }

    #applyOverlay:disabled {
      background: #1e1e2e;
      color: #404058;
      cursor: not-allowed;
    }

    #removeOverlay {
      background-color: #1f1014;
      color: #d04560;
      border: 1px solid #3d1a24;
    }

    #removeOverlay:hover:not(:disabled) {
      background-color: #2a1420;
      border-color: #8b2a3c;
    }

    #removeOverlay:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Status ── */
    #status {
      font-size: 11.5px;
      color: #606078;
      font-style: italic;
      min-height: 16px;
      text-align: center;
      padding: 2px 0 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
    <div>
      <h1>Image Overlay</h1>
      <p>Place an image over any page</p>
    </div>
  </div>

  <div class="container">

    <!-- Upload card -->
    <div class="card">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="imageUpload" accept="image/*">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="#6672f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"/>
            <line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
        </div>
        <div class="upload-label"><strong>Choose a file</strong> or drag it here</div>
      </div>
      <img id="imagePreview" alt="Preview">
    </div>

    <!-- Controls card -->
    <div class="card">

      <div class="slider-row">
        <div class="slider-header">
          <span class="slider-label">Opacity</span>
          <div class="slider-value-wrap">
            <input type="number" class="slider-value-input" id="opacityValue" min="1" max="100" value="50">
            <span class="slider-unit">%</span>
          </div>
        </div>
        <input type="range" id="opacitySlider" min="1" max="100" value="50">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span class="slider-label">Width</span>
          <div style="display: flex; align-items: center; gap: 6px;">
            <div class="slider-value-wrap">
              <input type="number" class="slider-value-input" id="widthValue" min="50" max="20000" value="500">
              <span class="slider-unit">px</span>
            </div>
            <button class="reset-btn" id="resetWidth" title="Reset to original">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="range" id="widthSlider" min="50" max="8000" value="500" step="10">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span class="slider-label">Top Offset</span>
          <div class="slider-value-wrap">
            <input type="number" class="slider-value-input" id="topValue" min="-9999" max="9999" value="0">
            <span class="slider-unit">px</span>
          </div>
        </div>
        <input type="range" id="topSlider" min="-1000" max="1000" value="0" step="1">
      </div>

      <div class="toggle-row">
        <span class="toggle-text">Adjust image manually</span>
        <label class="toggle-switch">
          <input type="checkbox" id="dragToggle" checked>
          <div class="toggle-track"></div>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-text">Retina mode (50% size)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="retinaToggle">
          <div class="toggle-track"></div>
        </label>
      </div>

    </div>

    <!-- Actions -->
    <div class="btn-group">
      <button id="applyOverlay" disabled>Apply Overlay</button>
      <button id="removeOverlay" disabled>Remove Overlay</button>
    </div>

    <div id="status"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
